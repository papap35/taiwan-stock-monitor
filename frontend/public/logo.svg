<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f1923"/>
      <stop offset="100%" stop-color="#0a1220"/>
    </linearGradient>
    <linearGradient id="brand-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="handle-grad" x1="310" y1="310" x2="460" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <clipPath id="lens-clip">
      <circle cx="210" cy="210" r="148"/>
    </clipPath>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- App icon background (rounded square) -->
  <rect x="0" y="0" width="512" height="512" rx="108" fill="url(#bg-grad)"/>

  <!-- Subtle grid lines -->
  <line x1="50" y1="50" x2="50" y2="320" stroke="rgba(59,130,246,.06)" stroke-width="1"/>
  <line x1="130" y1="50" x2="130" y2="320" stroke="rgba(59,130,246,.06)" stroke-width="1"/>
  <line x1="210" y1="50" x2="210" y2="320" stroke="rgba(59,130,246,.06)" stroke-width="1"/>
  <line x1="290" y1="50" x2="290" y2="320" stroke="rgba(59,130,246,.06)" stroke-width="1"/>
  <line x1="50" y1="320" x2="320" y2="320" stroke="rgba(59,130,246,.06)" stroke-width="1"/>
  <line x1="50" y1="240" x2="320" y2="240" stroke="rgba(59,130,246,.06)" stroke-width="1"/>
  <line x1="50" y1="160" x2="320" y2="160" stroke="rgba(59,130,246,.06)" stroke-width="1"/>

  <!-- Magnifying glass ring (outer glow) -->
  <circle cx="210" cy="210" r="155" stroke="rgba(139,92,246,.15)" stroke-width="16"/>
  <!-- Magnifying glass ring (main) -->
  <circle cx="210" cy="210" r="148" stroke="url(#brand-grad)" stroke-width="10" fill="#0c1820"/>

  <!-- Area fill under chart (inside lens) -->
  <polygon
    points="62,310 104,252 148,280 200,188 250,220 310,310"
    fill="rgba(59,130,246,.08)"
    clip-path="url(#lens-clip)"/>

  <!-- Candlestick wicks (inside lens) -->
  <line x1="104" y1="240" x2="104" y2="264" stroke="rgba(255,77,79,.5)" stroke-width="3" clip-path="url(#lens-clip)"/>
  <line x1="148" y1="268" x2="148" y2="292" stroke="rgba(0,196,140,.5)" stroke-width="3" clip-path="url(#lens-clip)"/>
  <line x1="200" y1="176" x2="200" y2="200" stroke="rgba(255,77,79,.5)" stroke-width="3" clip-path="url(#lens-clip)"/>
  <line x1="250" y1="208" x2="250" y2="232" stroke="rgba(255,77,79,.5)" stroke-width="3" clip-path="url(#lens-clip)"/>

  <!-- Candlestick bodies (inside lens) -->
  <rect x="96" y="248" width="16" height="16" rx="2" fill="#ff4d4f" clip-path="url(#lens-clip)"/>
  <rect x="140" y="274" width="16" height="18" rx="2" fill="#00c48c" clip-path="url(#lens-clip)"/>
  <rect x="192" y="184" width="16" height="16" rx="2" fill="#ff4d4f" clip-path="url(#lens-clip)"/>
  <rect x="242" y="212" width="16" height="20" rx="2" fill="#ff4d4f" clip-path="url(#lens-clip)"/>

  <!-- Trend line over candles (inside lens) -->
  <polyline
    points="62,310 104,252 148,280 200,188 250,220"
    fill="none"
    stroke="url(#brand-grad)"
    stroke-width="7"
    stroke-linecap="round"
    stroke-linejoin="round"
    clip-path="url(#lens-clip)"
    filter="url(#glow)"/>

  <!-- Latest price dot (glowing gold) -->
  <circle cx="250" cy="220" r="10" fill="#f59e0b" filter="url(#glow)" clip-path="url(#lens-clip)"/>
  <circle cx="250" cy="220" r="5" fill="#fcd34d" clip-path="url(#lens-clip)"/>

  <!-- Handle (magnifying glass) -->
  <line x1="328" y1="328" x2="454" y2="454" stroke="url(#handle-grad)" stroke-width="36" stroke-linecap="round"/>
  <line x1="328" y1="328" x2="454" y2="454" stroke="rgba(255,255,255,.1)" stroke-width="10" stroke-linecap="round"/>
</svg>
