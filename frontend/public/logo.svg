<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#0a1520"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="480" x2="512" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>

  <!-- Subtle horizontal grid lines -->
  <line x1="56" y1="160" x2="456" y2="160" stroke="rgba(56,189,248,.07)" stroke-width="1"/>
  <line x1="56" y1="230" x2="456" y2="230" stroke="rgba(56,189,248,.07)" stroke-width="1"/>
  <line x1="56" y1="300" x2="456" y2="300" stroke="rgba(56,189,248,.07)" stroke-width="1"/>
  <line x1="56" y1="370" x2="456" y2="370" stroke="rgba(56,189,248,.07)" stroke-width="1"/>

  <!-- Candlestick bars (decorative background) -->
  <!-- Bar 1 -->
  <line x1="96" y1="310" x2="96" y2="375" stroke="rgba(0,196,140,.2)" stroke-width="2"/>
  <rect x="88" y="320" width="16" height="40" rx="2" fill="rgba(0,196,140,.15)"/>
  <!-- Bar 2 -->
  <line x1="152" y1="285" x2="152" y2="350" stroke="rgba(0,196,140,.2)" stroke-width="2"/>
  <rect x="144" y="295" width="16" height="36" rx="2" fill="rgba(0,196,140,.15)"/>
  <!-- Bar 3 -->
  <line x1="208" y1="240" x2="208" y2="310" stroke="rgba(37,99,235,.2)" stroke-width="2"/>
  <rect x="200" y="250" width="16" height="38" rx="2" fill="rgba(37,99,235,.15)"/>
  <!-- Bar 4 -->
  <line x1="264" y1="195" x2="264" y2="265" stroke="rgba(37,99,235,.2)" stroke-width="2"/>
  <rect x="256" y="205" width="16" height="36" rx="2" fill="rgba(37,99,235,.15)"/>
  <!-- Bar 5 -->
  <line x1="320" y1="155" x2="320" y2="225" stroke="rgba(37,99,235,.2)" stroke-width="2"/>
  <rect x="312" y="165" width="16" height="36" rx="2" fill="rgba(37,99,235,.15)"/>
  <!-- Bar 6 -->
  <line x1="376" y1="120" x2="376" y2="190" stroke="rgba(37,99,235,.2)" stroke-width="2"/>
  <rect x="368" y="130" width="16" height="36" rx="2" fill="rgba(37,99,235,.15)"/>

  <!-- Rising trend line (glowing) -->
  <polyline
    points="88,355 144,322 200,278 256,230 312,185 384,142"
    fill="none" stroke="url(#accent)" stroke-width="4"
    stroke-linecap="round" stroke-linejoin="round"
    filter="url(#glow)" opacity="0.6"/>

  <!-- "TF" Monogram — center foreground -->
  <!-- T -->
  <rect x="128" y="176" width="112" height="18" rx="5" fill="url(#blue)"/>
  <rect x="175" y="176" width="18" height="110" rx="5" fill="url(#blue)"/>
  <!-- F -->
  <rect x="272" y="176" width="18" height="110" rx="5" fill="url(#blue)"/>
  <rect x="272" y="176" width="100" height="18" rx="5" fill="url(#blue)"/>
  <rect x="272" y="224" width="82" height="16" rx="5" fill="url(#blue)" opacity="0.85"/>

  <!-- Bottom accent bar -->
  <rect x="128" y="318" width="256" height="5" rx="2.5" fill="url(#accent)" opacity="0.5"/>

  <!-- Glowing dot on trend line endpoint -->
  <circle cx="384" cy="142" r="10" fill="#38bdf8" opacity="0.25"/>
  <circle cx="384" cy="142" r="5" fill="#38bdf8"/>
</svg>
